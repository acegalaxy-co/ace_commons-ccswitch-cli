# ci-cost.yml — workflow GitHub Actions tiết kiệm chi phí (generic, đã rửa).
# Ý tưởng: bước NHẸ (install + typecheck + lint) chạy MỌI trigger làm lưới;
#          bước NẶNG (build + test-full + e2e) chỉ chạy trên PR;
#          concurrency huỷ run cũ; timeout mọi job; cache deps + build.
# Thay <...> cho dự án của bạn. KHÔNG đụng deploy/migration-thật/secret-scan/codeql/cron.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Huỷ run cũ khi có commit mới trên cùng nhánh/PR → không chồng run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lưới NHẸ: chạy MỌI trigger (kể cả push main) để bắt lỗi typecheck/lint ──
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10          # chặn job treo "đốt phút"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'           # ⚠️ repo dùng pnpm: đổi sang cache của pnpm, đừng để 'npm'
      - run: npm ci
      - run: npm run typecheck   # tsc --noEmit — nhẹ, bắt phần lớn lỗi
      - run: npm run lint

  # ── Bước NẶNG: CHỈ chạy trên PR (bỏ lần lặp khi merge vào main) ──
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'   # ← gate: chỉ PR mới build nặng
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Cache thư mục build của framework (ví dụ .next/cache).
      # ⚠️ Repo KHÔNG có bước build thì BỎ block cache này (config chết).
      - uses: actions/cache@v4
        with:
          path: <build-cache-dir>            # vd: .next/cache
          key: build-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: build-${{ hashFiles('**/package-lock.json') }}-
      - run: npm run build
      - run: npm test                        # unit test full
      # - run: npm run e2e                   # e2e nếu có — cũng thuộc bước NẶNG
      # - run: npm run db:migrate:test       # migrate/seed lên DB TẠM trong CI (không phải DB thật)

  # LƯU Ý: nếu required status check gắn vào TÊN 'build-test',
  # build-test bị skip trên push main sẽ làm check thiếu → merge kẹt.
  # → Đặt required-check vào job 'check' (luôn chạy), KHÔNG vào 'build-test'.
