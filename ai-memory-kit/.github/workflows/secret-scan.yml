# Quét secret (gitleaks) — lưới bảo mật CHUNG, TÁCH riêng khỏi CI build/test (0 rủi ro app).
# gitleaks MIỄN PHÍ cho repo cá nhân Debill84 (không cần GITLEAKS_LICENSE).
# CHẶN merge nếu phát hiện secret. PR chỉ quét commit của PR; push main chỉ quét commit đẩy
# → lịch sử cũ được "grandfather" (thêm workflow này KHÔNG làm đỏ main). Xem 06 - Claude ci-may-gac.
name: Quét secret
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: read   # gitleaks-action goi API /pulls/{n}/commits khi chay tren PR (thieu → 403)
concurrency:
  group: secret-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # quét cả lịch sử commit
      - name: Quét secret (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
